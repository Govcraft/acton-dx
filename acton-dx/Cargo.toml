[package]
name = "acton-dx"
version = "1.0.0-beta.10"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/GovCraft/acton-dx"
homepage = "https://acton.dev"
keywords = ["web", "framework", "htmx", "axum", "hypermedia"]
categories = ["web-programming::http-server", "command-line-utilities"]
description = "Acton DX - Developer experience focused web framework for HTMX applications in Rust"
readme = "../README.md"

[lints]
workspace = true

[lib]
name = "acton_dx"
path = "src/lib.rs"

[[bin]]
name = "acton-dx"
path = "src/bin/main.rs"
required-features = ["cli"]

[dependencies]
# Core framework - provides axum, tokio, serde, tracing, chrono, uuid, thiserror, anyhow,
# async-trait, http, acton-reactive, sqlx, redis, figment, opentelemetry, etc.
acton-service = { workspace = true, optional = true }

# Tower middleware for custom layers
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

# HTMX-specific - not provided by acton-service
axum-htmx = { workspace = true, optional = true }
askama = { workspace = true, optional = true }
validator = { workspace = true, optional = true }

# Security & crypto - HTMX-specific
argon2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# Utilities
toml = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
time = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

# HTMX crate-specific dependencies
base64 = { version = "0.22.1", optional = true }
cron = { version = "0.15.0", optional = true }
multer = { version = "3.1.0", features = ["tokio-io"], optional = true }
bytes = { version = "1.11.0", optional = true }
mime = { version = "0.3.17", optional = true }
futures-util = { version = "0.3.31", optional = true }
infer = { version = "0.19.0", features = ["alloc"], optional = true }
image = { version = "0.25.6", features = ["jpeg", "png", "gif", "webp"], optional = true }
kamadak-exif = { version = "0.6.1", optional = true }
httpdate = { version = "1.0.3", optional = true }
lettre = { version = "0.11.19", features = ["smtp-transport", "builder", "tokio1-native-tls"], optional = true }
aws-sdk-sesv2 = { version = "1.82.0", optional = true }
aws-config = { version = "1.8.11", optional = true }
oauth2 = { version = "5.0.0", optional = true }
openidconnect = { version = "4.0.1", optional = true }
hex = { version = "0.4.3", optional = true }
reqwest = { version = "0.12.24", features = ["json"], optional = true }
cedar-policy = { version = "4.3", optional = true }
regex = { version = "1.12.2", optional = true }
dirs = { version = "6.0.0", optional = true }
clamav-client = { version = "2.2.0", features = ["tokio"], optional = true }
mime_guess = { version = "2.0.5", optional = true }
minijinja = { version = "2", features = ["loader"], optional = true }
notify = { version = "7", optional = true }
phf = { version = "0.11", features = ["macros"], optional = true }

# CLI dependencies
clap = { workspace = true, optional = true }
console = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
dialoguer = { workspace = true, optional = true }
walkdir = { version = "2", optional = true }
Inflector = { version = "0.11.4", features = ["heavyweight"], optional = true }
ureq = { version = "3.1.4", optional = true }
convert_case = { version = "0.9.0", optional = true }
similar = { version = "2", optional = true }
acton-dx-proto = { version = "0.1.0", path = "../acton-dx-proto", optional = true }
tonic = { workspace = true, optional = true }
tokio-stream = { version = "0.1.17", optional = true }
serde = { workspace = true, features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
async-trait = "0.1.89"
thiserror = "2.0.17"
anyhow = "1.0.100"
uuid = { version = "1.19.0", features = ["v4"] }
tracing.workspace = true
sqlx = { version = "0.8.6", features = ["chrono", "postgres", "runtime-tokio"], optional = true }
deadpool-redis = { version = "0.22.0", optional = true }
tokio = { version = "1.49.0", features = ["full"], optional = true }
serde_json = { version = "1.0.149", optional = true }
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"], optional = true }
axum = { version = "0.8.8", features = ["macros", "multipart"], optional = true }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
proptest.workspace = true
acton-service = { workspace = true }
tempfile = "3.23.0"
axum-test = "18.3"
mockall = "0.13"
criterion = { version = "0.7.0", features = ["async_tokio", "html_reports"] }

[features]
default = ["htmx", "cli", "postgres", "redis", "cedar"]

# HTMX web framework - uses acton-service as foundation
htmx = [
    "dep:acton-service",
    "dep:tokio",
    "dep:axum",
    "dep:serde_json",
    "dep:tower",
    "dep:tower-http",
    "dep:axum-htmx",
    "dep:askama",
    "dep:validator",
    "dep:argon2",
    "dep:rand",
    "dep:sha2",
    "dep:toml",
    "dep:hyper",
    "dep:time",
    "dep:once_cell",
    "dep:parking_lot",
    "dep:base64",
    "dep:cron",
    "dep:multer",
    "dep:bytes",
    "dep:mime",
    "dep:futures-util",
    "dep:infer",
    "dep:image",
    "dep:kamadak-exif",
    "dep:httpdate",
    "dep:lettre",
    "dep:oauth2",
    "dep:openidconnect",
    "dep:hex",
    "dep:reqwest",
    "dep:regex",
    "dep:dirs",
    "dep:mime_guess",
    "dep:minijinja",
    "dep:notify",
    "dep:phf",
    "dep:tracing-subscriber",
]

# CLI tool
cli = [
    "dep:clap",
    "dep:console",
    "dep:indicatif",
    "dep:dialoguer",
    "dep:walkdir",
    "dep:Inflector",
    "dep:ureq",
    "dep:convert_case",
    "dep:similar",
    "dep:minijinja",
    "dep:dirs",
]

# Database backends - uses acton-service database feature
postgres = ["htmx", "acton-service/database", "dep:sqlx"]
sqlite = ["htmx"]
mysql = ["htmx"]

# Optional features
redis = ["htmx", "acton-service/cache", "dep:deadpool-redis", "dep:redis"]
cedar = ["htmx", "dep:cedar-policy"]
otel-metrics = ["htmx", "acton-service/otel-metrics"]
aws-ses = ["htmx", "dep:aws-sdk-sesv2", "dep:aws-config"]
clamav = ["htmx", "dep:clamav-client"]
microservices = ["htmx", "dep:acton-dx-proto", "dep:tonic", "dep:tokio-stream"]
tracing-subscriber = ["dep:tracing-subscriber"]

[[bench]]
name = "agents_benchmark"
harness = false
required-features = ["htmx"]
