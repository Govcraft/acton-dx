[package]
name = "cedar-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "Cedar authorization service for Acton DX"
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "cedar-service"
path = "src/main.rs"

[dependencies]
# Core framework - provides tokio, serde, tracing, anyhow, parking_lot
acton-service = { workspace = true }
acton-dx-proto = { path = "../../acton-dx-proto" }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }

# Cedar-specific
cedar-policy = "4"

[dev-dependencies]
