[package]
name = "email-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "Email sending service for Acton DX"
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "email-service"
path = "src/main.rs"

[dependencies]
# Core framework - provides tokio, serde, tracing, uuid, anyhow
acton-service = { workspace = true }
acton-dx-proto = { path = "../../acton-dx-proto" }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }

# Email-specific
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }

[dev-dependencies]
