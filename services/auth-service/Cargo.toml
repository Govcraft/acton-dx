[package]
name = "auth-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "Authentication service for Acton DX - sessions, passwords, CSRF"
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "auth-service"
path = "src/main.rs"

[dependencies]
# Core framework - provides tokio, serde, tracing, chrono, uuid, thiserror, anyhow, acton-reactive
acton-service = { workspace = true }
acton-dx-proto = { path = "../../acton-dx-proto" }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }

# Auth-specific
argon2 = { workspace = true, features = ["std"] }
rand = { workspace = true }
dashmap = "6"
base64 = "0.22"
subtle = "2.6"

[dev-dependencies]
proptest = { workspace = true }
