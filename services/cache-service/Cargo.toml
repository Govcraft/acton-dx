[package]
name = "cache-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "Redis cache service for Acton DX"
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "cache-service"
path = "src/main.rs"

[dependencies]
# Core framework - provides tokio, serde, tracing, anyhow, redis (via cache feature)
acton-service = { workspace = true }
acton-dx-proto = { path = "../../acton-dx-proto" }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }

[dev-dependencies]
