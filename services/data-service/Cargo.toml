[package]
name = "data-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "Database abstraction service for Acton DX"
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "data-service"
path = "src/main.rs"

[dependencies]
# Core framework - provides tokio, serde, tracing, chrono, uuid, anyhow, sqlx (via database feature)
acton-service = { workspace = true }
acton-dx-proto = { path = "../../acton-dx-proto" }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }

# Data-specific
dashmap = "6"
