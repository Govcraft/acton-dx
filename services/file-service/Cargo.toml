[package]
name = "file-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "File storage service for Acton DX"
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "file-service"
path = "src/main.rs"

[dependencies]
# Core framework - provides tokio, serde, tracing, uuid, anyhow
acton-service = { workspace = true }
acton-dx-proto = { path = "../../acton-dx-proto" }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }

# File-specific
tokio-stream = "0.1"
sha2 = { workspace = true }
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
