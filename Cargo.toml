[workspace]
members = [
    "acton-dx",
    "acton-dx-proto",
    "services/auth-service",
    "services/data-service",
    "services/cedar-service",
    "services/cache-service",
    "services/email-service",
    "services/file-service",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allow during alpha development
cargo_common_metadata = "allow"
multiple_crate_versions = { level = "allow", priority = 1 }
doc_markdown = "allow"
module_name_repetitions = "allow"

[workspace.package]
version = "1.0.0-beta.8"
edition = "2021"
rust-version = "1.83.0"
authors = ["Acton Contributors"]
license = "MIT"
repository = "https://github.com/GovCraft/acton-dx"
homepage = "https://acton.dev"
keywords = ["web", "framework", "htmx", "axum", "hypermedia"]
categories = ["web-programming::http-server"]

[workspace.dependencies]
# Core framework - provides AppState, Config, ServiceBuilder, health, observability, agents, pools
# Re-exports tokio and anyhow as full crates, plus common types from serde, tracing, chrono, uuid
acton-service = { version = "0.9", features = ["http", "database", "cache", "observability", "resilience", "governor"] }

# These crates are used by acton-service but NOT fully re-exported in its prelude
# (prelude only exports specific types, not full crate access)
# Cargo deduplicates these with acton-service's own dependencies
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

# Tower middleware (acton-service uses internally but we need for custom middleware)
tower = "0.5"
tower-http = { version = "0.6.8", features = ["compression-full", "cors", "trace", "timeout", "limit"] }

# HTMX-specific - Template engine and integration
axum-htmx = { version = "0.8", features = ["auto-vary", "guards", "serde"] }
askama = "0.14"
validator = { version = "0.20", features = ["derive"] }

# Security & crypto (HTMX-specific, not in acton-service)
argon2 = { version = "0.5", features = ["std", "rand"] }
rand = "0.9"
sha2 = "0.10"

# Serialization (toml for config files)
toml = "0.9"

# HTTP (hyper for low-level HTTP if needed)
hyper = "1"

# Time (time crate for cookie expiration, etc.)
time = "0.3"

# Utilities
once_cell = "1"
parking_lot = "0.12"

# Testing
proptest = "1"

# gRPC / Protocol Buffers (for microservices)
prost = "0.13"
tonic = "0.13"

# CLI
clap = { version = "4", features = ["derive", "cargo"] }
console = "0.16"
indicatif = "0.18"
dialoguer = "0.12"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 1
